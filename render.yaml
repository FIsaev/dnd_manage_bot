# Render Blueprint, Docker flavour.
#
# A Render web service must open a port, and long polling never opens one, so
# this runs the bot in webhook mode. Render injects PORT (10000 by default) and
# bot.py binds it on 0.0.0.0. Render builds ./Dockerfile and runs its CMD, so
# no build or start command belongs here.
#
# BOT_TOKEN is the only thing to fill in: the webhook URL is taken from
# RENDER_EXTERNAL_URL, which Render fills with this service's own address.
# Set WEBHOOK_URL yourself only to override it (a custom domain, say), and add
# WEBHOOK_SECRET by hand if you want Telegram's requests signed.
#
# Without Docker, replace the two docker lines with:
#   runtime: python
#   buildCommand: pip install -r requirements.txt
#   startCommand: python bot.py
#
# On a paid plan, prefer "type: worker" and drop every webhook variable:
# polling needs no port, no public URL and no webhook at all.
services:
  - type: web
    name: dnd-manage-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BOT_TOKEN
        sync: false
